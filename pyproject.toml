[project]
name = "ret-c2-334"
version = "0.1.1"
description = "RETERPDocumentExtractionAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework wheel ships no py.typed marker, so every `framework.*` import
# resolves to Any. Under a bare `strict = true` that turns each required subclass
# into an error about subclassing Any — hundreds of them, none pointing at
# anything this template can fix.
disallow_subclassing_any = false
# The published sample nodes are reference material, excluded rather than
# annotated: editing them would change what the next template author copies.
exclude = ["src/examples/"]

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `AgentState` resolves to Any for the same reason as above, so every field of a
# TypedDict subclassing it fails `valid-type`. They are all one cause; silencing
# the code here is more honest than annotating around each field.
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
